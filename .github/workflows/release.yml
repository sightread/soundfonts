name: Publish soundfont releases

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      pack:
        description: Pack name to release (e.g., FluidR3_GM or SalC5Light2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pack
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACK: ${{ inputs.pack }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "pack=$INPUT_PACK" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == *"-"* ]]; then
            PACK="${GITHUB_REF_NAME%%-*}"
            echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot determine pack from tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth lame

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACK: ${{ steps.resolve.outputs.pack }}
        run: |
          VERSION=$(bun -e "const s = require('fs').readFileSync('soundfonts.json','utf8'); console.log(JSON.parse(s).packs['$PACK'].version)")
          EXPECTED_TAG="${PACK,,}-v${VERSION}"
          test "$RELEASE_TAG" = "$EXPECTED_TAG" || {
            echo "Expected tag $EXPECTED_TAG, received $RELEASE_TAG" >&2
            exit 1
          }

      - run: bun test

      - name: Fetch SF2 source
        run: bun run fetch -- --pack "${{ steps.resolve.outputs.pack }}"

      - name: Generate MIDI.js files
        run: bun run generate -- --pack "${{ steps.resolve.outputs.pack }}"

      - run: bun run verify
      - run: bun run package

      - name: Verify release checksums
        working-directory: dist
        env:
          PACK: ${{ steps.resolve.outputs.pack }}
        run: sha256sum --check "${PACK}-SHA256SUMS"

      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACK: ${{ steps.resolve.outputs.pack }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && {
            echo "Release $RELEASE_TAG already exists; publish a new version instead." >&2
            exit 1
          }
          VERSION=$(bun -e "const s = require('fs').readFileSync('soundfonts.json','utf8'); console.log(JSON.parse(s).packs['$PACK'].version)")
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "$PACK v${VERSION}" \
            --notes "Reproducible MIDI.js MP3 rendering of $PACK (${VERSION}). See the attached license notice and manifest for provenance and checksums."
